<script>
const $=i=>document.getElementById(i),cv=$('cv'),g=cv.getContext('2d');
const FN='asin acos atan sinh cosh tanh sin cos tan sqrt abs ln log exp'.split(' '),FR=/asin|acos|atan|sinh|cosh|tanh|sin|cos|tan|sqrt|abs|exp/g;

const ds=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
// ---- 表达式编译（只允许白名单符号）----
function C(src,V=[]){
 const T=[];
 for(const m of src.toLowerCase().matchAll(/\d+\.?\d*|[a-z]+|[-+*\/^(),]|\S/g)){
  let w=m[0];
  if(/[a-z]/.test(w)){while(w){const f=FN.find(f=>w.startsWith(f));

 let s='',p=['o','('];
 for(const k of T){const[a,v]=k,[pa,pv]=p;
  if(pa=='f'&&v!='('){s+='('+v+')';p=['n',')'];continue}
  if((pa=='n'||pv==')')&&(a=='n'||a=='f'||v=='('))s+='*';
  if(v=='-'&&pa=='o'&&pv!=')'&&pv!='^'){s+='-1*';p=k;continue}
  s+=v=='^'?'**':v;p=k}

const norm=s=>s.replace(/√/g,'sqrt ').replace(/[²³]/g,m=>m=='²'?'^2':'^3').replace(/[，、]/g,',').replace(/；/g,';').replace(/（/g,'(').replace(/）/g,')').replace(/＝/g,'=').replace(/[－—–]/g,'-').replace(/＋/g,'+').replace(/[×·∙⋅]/g,'*').replace(/÷/g,'/').replace(/[θαφ]/g,'t').replace(/π/g,'pi').replace(/垂直于?/g,'⊥').replace(/\r/g,'');

function implicit(F,D,N){
 const h=2*D/N,n1=N+1,v=new Float64Array(n1*n1),I=(i,j)=>i*n1+j;

 const lk=(a,b)=>{(adj.get(a)||adj.set(a,[]).get(a)).push(b);(adj.get(b)||adj.set(b,[]).get(b)).push(a)};
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const a=v[I(i,j)]>0,b=v[I(i+1,j)]>0,c=v[I(i+1,j+1)]>0,d=v[I(i,j+1)]>0,r=[];
  if(a!=b)r.push(E(i,j,'h'));if(b!=c)r.push(E(i+1,j,'v'));if(d!=c)r.push(E(i,j+1,'h'));if(a!=d)r.push(E(i,j,'v'));
  if(r.length==2)lk(r[0],r[1]);else if(r.length==4){lk(r[0],r[1]);lk(r[2],r[3])}}

function build(lines,closed){const o=[];let s=0;closed=closed&&lines.length==1;
 lines.forEach(l=>dens(l,closed).forEach((p,i)=>{if(o.length&&i)s+=ds([p[0],p[1]],[o[o.length-1].x,o[o.length-1].y]);o.push({x:p[0],y:p[1],s,b:i==0})}));

// ---- 文字解析 ----
function parse(raw){

 // env 支持单点或双点：env(p) 或 env(p1,p2)
 const env=(p,p2)=>{const e={...pts,[mv]:p};if(mv2&&p2)e[mv2]=p2;der.forEach(d=>e[d.n]=d.f(e));return e};
 const G=(n,p,p2)=>env(p,p2)[n];
 const num=(r,d)=>{const k=s.match(r);return k?+k[1]:d};
 const SL={};for(const k of s.matchAll(/(?<![A-Z])([A-Z])([A-Z])\s*=\s*([\d.]+)/g))SL[[k[1],k[2]].sort().join('')]=+k[3];
 const tn=((s.match(/(?:三角形|△)\s*([A-Z]{3})/)||[])[1])||[...new Set(Object.keys(SL).join(''))].sort().join('');
 if(tn.length==3&&![...tn].some(c=>pts[c]||c==mv)){const[n0,n1,n2]=[...tn],sk=(x,y)=>SL[[x,y].sort().join('')],c=sk(n0,n1),b=sk(n0,n2),a=sk(n1,n2);
  if(c&&b&&a){const co=(b*b+c*c-a*a)/(2*b*c);if(Math.abs(co)>=1)throw Error('这三条边长构不成三角形');pts[n0]=[0,0];pts[n1]=[c,0];pts[n2]=[b*co,b*Math.sqrt(1-co*co)];[...tn].forEach(q=>used.add(q))}}
 // 反射辅助函数：点C关于直线AB的对称点
 const reflect=(C,A,B)=>{const dx=B[0]-A[0],dy=B[1]-A[1],l2=dx*dx+dy*dy||1e-12;

 // 点对称：关于点M
 const pointReflect=(C,M)=>[2*M[0]-C[0],2*M[1]-C[1]];
 const dfs=[];
 for(const k of s.matchAll(/([A-Z])([A-Z])\s*⊥\s*([A-Z])([A-Z])\s*(?:于|,?\s*垂足\s*(?:为|是)?)\s*([A-Z])/g))dfs.push({i:k.index,t:'f',k});
 for(const k of s.matchAll(/([A-Z])\s*(?:为|是)\s*(?:线段)?\s*([A-Z])([A-Z])\s*的?\s*中点/g))dfs.push({i:k.index,t:'m',k});
 // 对称点 / 折叠（关于直线或点）
 for(const k of s.matchAll(/([A-Z])\s*(?:为|是)\s*([A-Z])\s*关于\s*(?:直线)?\s*([A-Z])([A-Z])\s*的?\s*(?:对称点|对称|折叠)/g))dfs.push({i:k.index,t:'r',k});
 for(const k of s.matchAll(/([A-Z])\s*(?:为|是)\s*([A-Z])\s*关于\s*点?\s*([A-Z])\s*的?\s*(?:对称点|对称|中心对称)/g))dfs.push({i:k.index,t:'pr',k});
 // 折叠后得到 / 对称得到 的写法
 for(const k of s.matchAll(/(?:把|将)\s*([A-Z])\s*(?:沿|关于)\s*(?:直线)?\s*([A-Z])([A-Z])\s*(?:折叠|对称)\s*(?:得到|到|为)\s*([A-Z])/g))dfs.push({i:k.index,t:'r2',k});
 for(const k of s.matchAll(/([A-Z])\s*(?:是|为)\s*([A-Z])\s*的?\s*(?:对称点|像)/g)){ // 简单“Q是P的对称点”需上下文，暂忽略或结合前面
 }
 dfs.sort((x,y)=>x.i-y.i).forEach(({t,k})=>{
  if(t=='m'){const a=k[2],b=k[3];[a,b].forEach(need);der.push({n:k[1],links:[[a,b]],f:e=>[(e[a][0]+e[b][0])/2,(e[a][1]+e[b][1])/2]})}

   der.push({n:q,links:[[src,q],[a,b]],f:e=>reflect(e[src],e[a],e[b])})}

  else if(t=='r2'){const src=k[1],a=k[2],b=k[3],q=k[4];[src,a,b].forEach(need);
   der.push({n:q,links:[[src,q],[a,b]],f:e=>reflect(e[src],e[a],e[b])})}
 });

 if(allMv.length>1){
  const candidates=allMv.filter(c=>c!==mv&&!pts[c]&&!der.some(d=>d.n===c));

 let constrained=null; // {tMin,tMax, posE, posF, ...}

 for(const k of s.matchAll(/(?:点)?([A-Z])\s*(?:在|位于)\s*(?:边)?\s*([A-Z])([A-Z])\s*(?:上|边)/g)){
  sidePts.push({n:k[1], side:[k[2],k[3]]});

  (E.mx.length||E.dual?rows:'<p>该目标量在运动过程中<b>恒为定值 '+f3(S.mx)+'</b>。</p>')+
  (S.der.some(d=>d.tr)?'<p><span class="k">轨迹　</span>橙色虚线是点'+esc(S.der.filter(d=>d.tr).map(d=>d.n).join('、'))+'的运动轨迹</p>':'')+
  (S.note?'<p class="k">'+esc(S.note)+'</p>':'')+'<p class="k">点击最值可跳到对应位置；拖动画布平移，滚轮或＋－缩放。</p>'}
function run(){
 try{S=parse($('tx').value);V.set=0;fit();u=0;u2=0;dir=1;play=true;$('pl').textContent='⏸';
  // 显示/隐藏副点滑块
  const has2=!!S.mv2;$('pr2').style.display=$('lb2').style.display=has2?'':'none';
  $('pr').value=0;$('pr2').value=0;report();draw()}
 catch(e){$('rs').innerHTML='<p class="e"><b>'+esc(e.message)+'</b></p><p class="k">试试点上面的示例，看看描述的写法。</p>'}}
$('go').onclick=run;
$('rs').onclick=e=>{const b=e.target.closest('[data-u],[data-u1]');if(b){
  if(b.dataset.u1!==undefined){u=+b.dataset.u1;u2=+b.dataset.u2;$('pr').value=u*1000;$('pr2').value=u2*1000}
  else{u=+b.dataset.u;$('pr').value=u*1000}
  play=false;$('pl').textContent='▶';draw()}};
$('pl').onclick=()=>{play=!play;$('pl').textContent=play?'⏸':'▶'};
$('pr').oninput=e=>{u=Math.min(e.target.value/1000,.9999);play=false;$('pl').textContent='▶';draw()};
$('pr2').oninput=e=>{u2=Math.min(e.target.value/1000,.9999);play=false;$('pl').textContent='▶';draw()};
const EX=[
 '点P在圆x²+y²=4上运动，A(3,0)，求PA的最大值和最小值',
 '点P在椭圆x²/9+y²/4=1上运动，A(2,0)，求PA的最值',
 '点P在线段AB上运动，A(0,0)，B(6,0)，C(2,4)，求PC的最小值',
 '点P在抛物线y=x²上运动，A(0,3)，M为线段AP的中点，求PA的最小值',
 'x=3cosθ，y=2sinθ，求x+y的最大值和最小值',
 'r=2(1+cosθ)，求y的最大值',
 '点P在正方形ABCD的边上运动，边长为4，E(6,2)，求PE的最值',
 '在三角形ABC中，AB=3，AC=4，BC=5，P为边BC上一动点，PE⊥AB于E，PF⊥AC于F，M为EF的中点，求AM最小值',
 '点P在圆x²+y²=9上运动，A(0,0)，B(4,0)，Q为P关于直线AB的对称点，求QA的最小值',
 '点P在线段AB上运动，A(0,0)，B(6,0)，C(3,4)，把P关于AC折叠得到Q，求BQ的最小值',
 '点P、Q为圆x²+y²=4上的两动点，求PQ的最大值',
 '正方形ABCD边长为4，点E在边BC上，点F在边CD上，BE=CF，求BF+DE的最小值'
];
EX.forEach((t,i)=>{const b=document.createElement('button');b.textContent=['圆上的距离','椭圆上的距离','线段上最短距离','抛物线与中点','参数方程','心形线','正方形边上','垂足与中点','对称点轨迹','折叠对称','双动点PQ','正方形等长约束'][i];b.onclick=()=>{$('tx').value=t;run()};$('ch').append(b)});
$('tx').value=EX[0];$('tx').placeholder='用一句话描述：点在哪个图形上运动，已知点/中点/垂足/对称点，求什么（距离、面积、表达式等）';
$('tx').addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.ctrlKey||e.metaKey))run()});
// 平移、缩放
let dg=null;const zoom=(k,cx=W/2,cy=H/2)=>{const wx=(cx-W/2-V.ox)/V.sc,wy=(H/2+V.oy-cy)/V.sc;V.sc*=k;V.ox=cx-W/2-wx*V.sc;V.oy=cy-H/2+wy*V.sc;V.set=1;draw()};
cv.onpointerdown=e=>{dg=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
cv.onpointermove=e=>{if(!dg)return;V.ox+=e.clientX-dg[0];V.oy+=e.clientY-dg[1];dg=[e.clientX,e.clientY];V.set=1;draw()};
cv.onpointerup=()=>{dg=null;cv.style.cursor='grab'};
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)};
$('zi').onclick=()=>zoom(1.3);$('zo').onclick=()=>zoom(1/1.3);$('zf').onclick=()=>{if(S){V.set=0;fit();draw()}};
// 动画循环（沿弧长匀速；闭合曲线循环，开放曲线往返）
function loop(t){const dt=Math.min((t-last)/1000,.1);last=t;
 if(S&&play){u+=dir*dt*$('sp').value/8;if(S.path.closed)u=(u%1+1)%1;else if(u>=1){u=1;dir=-1}else if(u<=0){u=0;dir=1}$('pr').value=u*1000;draw()}
 requestAnimationFrame(loop)}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
run();requestAnimationFrame(loop);
</script></body></html>
